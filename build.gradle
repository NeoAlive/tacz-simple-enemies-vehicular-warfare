plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'com.diffplug.spotless' version '6.25.0'
}

// ---------------------------------------------------------------------------------------------
// NeoForge 1.21.1 port branch (port/neoforge-1.21.1). main stays Forge 1.20.1 and keeps getting
// features; this branch merges main forward. Platform differences that touch many files live
// behind com.neoalive.tacz_sewv.platform so call sites read the same on both branches.
// ---------------------------------------------------------------------------------------------

version = "${mod_version}+mc${minecraft_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

// NeoForge 1.21.1 runs on Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

// ---------------------------------------------------------------------------------------------
// Dormant integrations.
// Integrations that reach their mod only through ModList / Class.forName / registry ids (NeoArms,
// Coltan+GemRender, FCP, MCSP, VVP, Ash, Spore, Phayriosis, DNV) compile without it and simply
// stay inert; only the ones whose files name a foreign type are listed below. Optional-mod compat is not ported yet: these sources stay in the tree
// (they still build on main) but are not compiled here, no mixin config of theirs is loaded, and
// neoforge.mods.toml names none of them. Core code reaches each one through a facade that
// src/dormant-stubs/java replaces with a constant-false copy of the same public surface
// (selfCheckDormantStubs keeps the two in step). Re-activating a mod = drop its lines here,
// delete its stub, port its foreign-typed files against that mod's 1.21.1 build.
// ---------------------------------------------------------------------------------------------
def dormantSources = [
        // Xaero's World Map
        'com/neoalive/tacz_sewv/client/xaero/**',
        'com/neoalive/tacz_sewv/mixin/client/MixinGuiMap.java',
        'com/neoalive/tacz_sewv/mixin/client/MixinGuiMapPause.java',
        'com/neoalive/tacz_sewv/mixin/XaeroMixinPlugin.java',
        // Komodo
        'com/neoalive/tacz_sewv/mixin/client/MixinKmodoDormancy.java',
        'com/neoalive/tacz_sewv/mixin/client/MixinKmodoLight.java',
        'com/neoalive/tacz_sewv/mixin/KomodoMixinPlugin.java',
        // Corpse
        'com/neoalive/tacz_sewv/compat/CorpseCompat.java',
        'com/neoalive/tacz_sewv/mixin/MixinCorpseEntity.java',
        'com/neoalive/tacz_sewv/mixin/client/MixinCorpseRenderer.java',
        'com/neoalive/tacz_sewv/mixin/client/MixinAbstractClientPlayerCorpseSkin.java',
        'com/neoalive/tacz_sewv/mixin/CorpseMixinPlugin.java',
        // PlayerRevive
        'com/neoalive/tacz_sewv/compat/PlayerReviveCompat.java',
        'com/neoalive/tacz_sewv/mixin/MixinReviveEventServer.java',
        'com/neoalive/tacz_sewv/mixin/PlayerReviveMixinPlugin.java',
        // MineColonies
        'com/neoalive/tacz_sewv/compat/MineColoniesCompat.java',
        'com/neoalive/tacz_sewv/compat/minecolonies/**',
        'com/neoalive/tacz_sewv/mixin/minecolonies/**',
        'com/neoalive/tacz_sewv/mixin/MineColoniesMixinPlugin.java',
        // Limitless Vehicles (LvCompat / LvGoals are stubbed)
        'com/neoalive/tacz_sewv/compat/lv/**',
        // Enhanced Falling Trees (EnhancedFallingTreesCompat is ModList-only and stays compiled)
        'com/neoalive/tacz_sewv/compat/EnhancedFallingTreesFeller.java',
        // Berezka
        'com/neoalive/tacz_sewv/compat/BerezkaStructureCompat.java',
        // Open Parties and Claims
        'com/neoalive/tacz_sewv/compat/OpenPacCompat.java',
]
def dormantMixinConfigs = [
        'tacz_sewv.xaero.mixins.json',
        'tacz_sewv.komodo.mixins.json',
        'tacz_sewv.corpse.mixins.json',
        'tacz_sewv.playerrevive.mixins.json',
        'tacz_sewv.minecolonies.mixins.json',
]
sourceSets {
    main {
        java {
            srcDir 'src/dormant-stubs/java'
            exclude dormantSources
        }
        resources {
            exclude dormantMixinConfigs
        }
    }
    test {
        java {
            // LV's steering self-check reads compat/lv sources that are dormant on this branch.
            exclude 'com/neoalive/tacz_sewv/compat/lv/**'
        }
    }
}

// ---------------------------------------------------------------------------------------------
// Port dependency jars. libs-neo/ (gitignored, separate from the Forge libs/) holds the two
// sibling-built mods plus everything SBW jar-in-jars, which a dev run does not unpack.
//   ./gradlew syncPortDeps    (after building SBW 0.8.9.1-1.21 and the SEM port)
// ---------------------------------------------------------------------------------------------
def libsNeo = file('libs-neo')
def libsNeoJij = file('libs-neo/jij')

tasks.register('syncPortDeps') {
    group = 'neoforge port'
    description = 'Copies SBW 0.8.9.1-1.21 and the SEM port jars into libs-neo/, plus SBW\'s jar-in-jars.'
    doLast {
        def sbwLibs = file("${projectDir}/${sbw_port_dir}/build/libs")
        def sbwJars = fileTree(sbwLibs) {
            include "superbwarfare-${sbw_required_version}-*.jar"
            exclude '*-sources.jar', '*-slim.jar', '*-api.jar'
        }.files
        if (sbwJars.size() != 1) {
            throw new GradleException("Expected exactly one superbwarfare-${sbw_required_version}-*.jar in ${sbwLibs}, found ${sbwJars*.name}")
        }
        def semJar = file("${projectDir}/${sem_port_dir}/build/libs/simpleenemymod-${sem_port_version}.jar")
        if (!semJar.isFile()) {
            throw new GradleException("Missing ${semJar} — run ./gradlew build in the SEM port first.")
        }
        libsNeo.mkdirs()
        copy { from sbwJars.first(); into libsNeo; rename { 'superbwarfare.jar' } }
        copy { from semJar; into libsNeo; rename { 'simpleenemymod.jar' } }
        delete libsNeoJij
        copy {
            from(zipTree(sbwJars.first())) { include 'META-INF/jarjar/*.jar' }
            into libsNeoJij
            eachFile { it.path = it.name }
            includeEmptyDirs = false
        }
        println "SBW: ${sbwJars.first().name}  SEM: ${semJar.name}  jij: ${libsNeoJij.list()?.toList()}"
    }
}

// A jar-in-jar that carries its own mods.toml is a mod (runtime classpath); anything else is a
// plain library and must go on the additional runtime classpath to be visible to mods.
def jijJars = libsNeoJij.isDirectory() ? (libsNeoJij.listFiles({ f -> f.name.endsWith('.jar') } as FileFilter) as List) : []
def isModJar = { File jar ->
    def z = new java.util.zip.ZipFile(jar)
    try { return z.getEntry('META-INF/neoforge.mods.toml') != null || z.getEntry('META-INF/mods.toml') != null } finally { z.close() }
}
def jijMods = jijJars.findAll { isModJar(it) }
def jijLibs = jijJars.findAll { !isModJar(it) }

repositories {
    flatDir {
        dirs 'libs-neo'
    }
    maven {
        name = "Curse Maven"
        url = "https://www.cursemaven.com"
        content { includeGroup "curse.maven" }
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
    maven {
        name = "curios"
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content { includeGroup "thedarkcolour" }
    }
    maven {
        url = "https://jitpack.io"
        content { includeGroupByRegex "com\\.github\\.(?i)mcmodderanchor" }
    }
    // MAE (Mayday Animation Engine) — compile-only companion of SBM; SBM jarjars it at runtime.
    maven {
        url = "https://maven.sighs.cc/repository/maven-public/"
        content { includeGroup "com.maydaymemory" }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        configureEach {
            // Fresh worlds only on this branch: keep 1.21.1 run dirs apart from the Forge ones.
            gameDirectory = project.file('run-neo')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // A missed injection must crash at boot, not degrade silently.
            systemProperty 'mixin.debug.verify', 'true'
            systemProperty 'mixin.checks.interfaces', 'true'
            logLevel = org.slf4j.event.Level.DEBUG
        }
        client {
            client()
        }
        // Multiplayer test clients — separate game dirs and usernames.
        clientA {
            client()
            gameDirectory = project.file('run-neo-client-a')
            programArguments.addAll '--username', 'SEWV_Test_A'
        }
        clientB {
            client()
            gameDirectory = project.file('run-neo-client-b')
            programArguments.addAll '--username', 'SEWV_Test_B'
        }
        server {
            server()
            programArgument '--nogui'
        }
        // Dedicated dev server — separate game dir.
        serverDev {
            server()
            gameDirectory = project.file('run-neo-server-dev')
            programArgument '--nogui'
            if (project.hasProperty('guncacheProbe')) {
                systemProperty 'sewv.guncacheProbe', 'true'
            }
        }
        gameTestServer {
            type = "gameTestServer"
        }
        data {
            data()
            gameDirectory = project.file('run-neo-data')
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // Superb Warfare 0.8.9.1-1.21 and the SEM port (libs-neo/, see syncPortDeps).
    implementation "blank:superbwarfare:1.0"
    implementation "blank:simpleenemymod:1.0"
    // TaCZ 1.21.1 NeoForge — the same pin the SEM port builds against.
    implementation "curse.maven:tacz-1-21-1-1353462:8318179"
    // SBW is Kotlin; its public surface (companions, properties) needs the stdlib to compile.
    implementation "thedarkcolour:kotlinforforge-neoforge:5.10.0"
    // Core soft-deps SBW jar-in-jars (Curios: parachute/NVG slots; GeckoLib: armor layers;
    // SimpleBedrockModel: SBW armor renderer). Compile against their APIs; at runtime the
    // copies unpacked from SBW's jar are used so versions match what SBW ships.
    compileOnly "top.theillusivec4.curios:curios-neoforge:9.2.0+1.21.1:api"
    compileOnly "software.bernie.geckolib:geckolib-neoforge-1.21.1:4.7.5"
    compileOnly "com.github.MCModderAnchor:SimpleBedrockModel:2.5.1.1-neoforge-mc1.21.1"
    compileOnly("com.maydaymemory:mae:1.1.2") {
        exclude group: "com.google.code.findbugs", module: "jsr305"
        exclude group: "it.unimi.dsi", module: "fastutil"
        exclude group: "org.joml", module: "joml"
    }
    jijMods.each { localRuntime files(it) }
    jijLibs.each { additionalRuntimeClasspath files(it) }
    // SEM's own optional deps it needs at runtime in dev (GeckoLib is covered by SBW's jij).
    localRuntime "com.eliotlash.mclib:mclib:20"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            sbw_version_range      : sbw_version_range,
            sem_version_range      : sem_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('processResources', ProcessResources).configure {
    var packProperties = [mod_id: mod_id]
    inputs.properties packProperties
    filesMatching(['pack.mcmeta']) {
        expand packProperties
    }
}

