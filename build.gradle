plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '[0.7,)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        // Multiplayer test client A — separate game dir, username SEWV_Test_A
        clientA {
            parent runs.client
            workingDirectory project.file('run-client-a')
            args '--username', 'SEWV_Test_A'
        }

        // Multiplayer test client B — separate game dir, username SEWV_Test_B
        clientB {
            parent runs.client
            workingDirectory project.file('run-client-b')
            args '--username', 'SEWV_Test_B'
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // Dedicated dev server — separate game dir, bound to localhost
        serverDev {
            parent runs.server
            workingDirectory project.file('run-server-dev')
            // '--nogui' is inherited from the parent server run; no need to repeat it.
            property 'forge.server.address', '127.0.0.1'
            // One-shot gun-map cache probe: ./gradlew runServerDev -PguncacheProbe
            if (project.hasProperty('guncacheProbe')) {
                property 'sewv.guncacheProbe', 'true'
            }
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Forward stdin to the dev server so console commands (op, stop, etc.) work interactively.
// Gradle's JavaExec tasks default to an empty stdin; this wires the real terminal through.
// configureEach fires lazily when each task is registered — safe regardless of when
// ForgeGradle adds its run tasks (afterEvaluate ordering is not guaranteed).
tasks.configureEach { task ->
    if (task.name == 'runServerDev' && task instanceof JavaExec) {
        task.standardInput = System.in
    }
}

// Pure-function self-checks (no game launch). No test framework — see *SelfCheck mains.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output

tasks.register('selfCheckUtility', JavaExec) {
    group = 'verification'
    description = 'Runs the utility-AI scorer self-check.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.output
    mainClass = 'com.neoalive.tacz_sewv.entity.ai.utility.UtilityWeightsSelfCheck'
    jvmArgs '-ea'
}

tasks.register('selfCheckWeapons', JavaExec) {
    group = 'verification'
    description = 'Runs the vehicle-weapon classifier self-check.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.output
    mainClass = 'com.neoalive.tacz_sewv.entity.ai.VehicleWeaponsClassifySelfCheck'
    jvmArgs '-ea'
}

tasks.register('selfCheckGrouping', JavaExec) {
    group = 'verification'
    description = 'Runs the command-tier grouping self-check.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.output
    mainClass = 'com.neoalive.tacz_sewv.entity.ai.command.GroupingSelfCheck'
    jvmArgs '-ea'
}

tasks.register('selfCheckElection', JavaExec) {
    group = 'verification'
    description = 'Runs the command-tier election self-check.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.output
    mainClass = 'com.neoalive.tacz_sewv.entity.ai.command.ElectionSelfCheck'
    jvmArgs '-ea'
}

tasks.register('selfCheckInfluence', JavaExec) {
    group = 'verification'
    description = 'Runs the command-tier influence-map self-check.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.output
    mainClass = 'com.neoalive.tacz_sewv.entity.ai.command.InfluenceMapSelfCheck'
    jvmArgs '-ea'
}

tasks.register('selfCheckPlay', JavaExec) {
    group = 'verification'
    description = 'Runs the command-tier play-selection self-check.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.output
    mainClass = 'com.neoalive.tacz_sewv.entity.ai.command.PlaySelfCheck'
    jvmArgs '-ea'
}

tasks.register('selfCheckSeam', JavaExec) {
    group = 'verification'
    description = 'Runs the command-tier assignment→Signal seam self-check.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.output
    mainClass = 'com.neoalive.tacz_sewv.entity.ai.command.SeamSelfCheck'
    jvmArgs '-ea'
}

tasks.register('selfCheckHeli', JavaExec) {
    group = 'verification'
    description = 'Runs the guided-heli standoff geometry self-check.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.output
    mainClass = 'com.neoalive.tacz_sewv.entity.ai.HeliStandoffSelfCheck'
    jvmArgs '-ea'
}

tasks.register('selfCheckHeliArmament', JavaExec) {
    group = 'verification'
    description = 'Runs the heli pilot armament discriminator self-check.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.output
    mainClass = 'com.neoalive.tacz_sewv.entity.ai.HeliArmamentSelfCheck'
    jvmArgs '-ea'
}

tasks.register('selfCheck') {
    group = 'verification'
    description = 'Runs all headless AI self-checks.'
    dependsOn 'selfCheckUtility', 'selfCheckWeapons', 'selfCheckGrouping', 'selfCheckElection', 'selfCheckInfluence', 'selfCheckPlay', 'selfCheckSeam', 'selfCheckHeli', 'selfCheckHeliArmament'
}

mixin {
    add sourceSets.main, "tacz_sewv.refmap.json"
    config "tacz_sewv.mixins.json"
    // Separate config + XaeroMixinPlugin gate — World Map is optional; main config is required.
    config "tacz_sewv.xaero.mixins.json"
}

repositories {
    maven {
        url "https://chocolateminecraft.com/maven"
        name "Xaero's Maven"
    }
    flatDir {
        dirs 'libs'
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        url = "https://maven.theillusivec4.top/"
        url = 'https://maven.parchmentmc.org'
        url = "https://repo.sleeping.town/"
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("blank:superbwarfare:1.0")
    implementation fg.deobf("blank:curios:1.0")
    implementation fg.deobf("blank:geckolib:1.0")
    implementation fg.deobf("blank:kotlin:1.0")
    implementation fg.deobf("blank:simpleenemymod:1.0")
    implementation fg.deobf("blank:tacz:1.0")
    compileOnly fg.deobf("blank:berezka_api:1.0")
    // Soft: compile against OpenPAC API, keep off the published jar (same pattern as berezka_api).
    // runtimeOnly puts it on every run classpath for local testing with OpenPAC present.
    // Absent-path verification: ./gradlew runServerDev -PnoOpenPac  (skips runtimeOnly;
    // rename/remove libs/openpac.jar is the nuclear alternative if the property is ignored).
    compileOnly fg.deobf("blank:openpac:1.0")
    if (!project.hasProperty('noOpenPac')) {
        runtimeOnly fg.deobf("blank:openpac:1.0")
    }
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // Soft: compile against Xaero's World Map; keep it off installs that omit it.
    // Absent-path verification: ./gradlew runClient -PnoXaero  (skips runtimeOnly;
    // XaeroMixinPlugin then refuses MixinGuiMap* so no "target was not found" warning).
    compileOnly "xaero.map:xaeroworldmap-forge-1.20.1:1.44.2:dev"
    if (!project.hasProperty('noXaero')) {
        runtimeOnly "xaero.map:xaeroworldmap-forge-1.20.1:1.44.2:dev"
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing:
// tasks.named('publish').configure {
//     dependsOn 'reobfJar'
// }

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
