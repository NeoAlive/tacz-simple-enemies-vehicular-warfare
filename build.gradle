plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '[0.7,)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'com.diffplug.spotless' version '6.25.0'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        // Multiplayer test client A — separate game dir, username SEWV_Test_A
        clientA {
            parent runs.client
            workingDirectory project.file('run-client-a')
            args '--username', 'SEWV_Test_A'
        }

        // Multiplayer test client B — separate game dir, username SEWV_Test_B
        clientB {
            parent runs.client
            workingDirectory project.file('run-client-b')
            args '--username', 'SEWV_Test_B'
        }

        // Average-modpack client — jars from modpack/ (synced from Prism; see syncModpack).
        // Overlaps already on the FG classpath (libs + soft runtimeOnly) are stripped so
        // Forge does not double-load them; this mod is always the sourceset, never the jar.
        modded {
            parent runs.client
            workingDirectory project.file('run-modded')
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // Dedicated dev server — separate game dir, bound to localhost
        serverDev {
            parent runs.server
            workingDirectory project.file('run-server-dev')
            // '--nogui' is inherited from the parent server run; no need to repeat it.
            property 'forge.server.address', '127.0.0.1'
            // One-shot gun-map cache probe: ./gradlew runServerDev -PguncacheProbe
            if (project.hasProperty('guncacheProbe')) {
                property 'sewv.guncacheProbe', 'true'
            }
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Forward stdin to the dev server so console commands (op, stop, etc.) work interactively.
// Gradle's JavaExec tasks default to an empty stdin; this wires the real terminal through.
// configureEach fires lazily when each task is registered — safe regardless of when
// ForgeGradle adds its run tasks (afterEvaluate ordering is not guaranteed).
// Average-modpack jars live in modpack/ (gitignored). syncModpack pulls from Prism;
// syncRunModdedMods mirrors them into run-modded/mods without the FG-classpath overlaps.
// Named away from prepareRunModded — ForgeGradle already owns that for the modded run.
def modpackSource = file(findProperty('modpack_source')
        ?: "${System.getProperty('user.home')}/.local/share/PrismLauncher/instances/1.20.1(1)/minecraft/mods")
def modpackDir = file('modpack')
def runModdedMods = file('run-modded/mods')
// Already loaded via dependencies { } — putting these in run/mods double-registers the modid.
def modpackClasspathOverlaps = [
        'tacz_sewv*.jar',
        'superbwarfare*.jar',
        'curios*.jar',
        'geckolib*.jar',
        'kotlinforforge*.jar',
        'simpleenemymod*.jar',
        'tacz-*.jar',           // not taczaddon / tacz_presence / tacz_x_guns
        'xaeroworldmap*.jar',
        'open-parties-and-claims*.jar',
]

tasks.register('syncModpack', Sync) {
    group = 'forge'
    description = "Copies enabled jars from ${modpackSource} into modpack/ (skips *.disabled)."
    from(modpackSource) {
        include '*.jar'
        exclude 'tacz_sewv*.jar'
    }
    into modpackDir
}

tasks.register('syncRunModdedMods', Sync) {
    group = 'forge'
    description = 'Mirrors modpack/ into run-modded/mods, excluding jars already on the FG classpath.'
    from(modpackDir) {
        include '*.jar'
        exclude modpackClasspathOverlaps
    }
    into runModdedMods
}

tasks.configureEach { task ->
    if (task.name == 'runServerDev' && task instanceof JavaExec) {
        task.standardInput = System.in
    }
    if (task.name == 'runModded') {
        task.dependsOn 'syncRunModdedMods'
    }
}

