mixin {
    add sourceSets.main, "tacz_sewv.refmap.json"
    config "tacz_sewv.mixins.json"
    // Separate config + XaeroMixinPlugin gate — World Map is optional; main config is required.
    config "tacz_sewv.xaero.mixins.json"
    // Separate config + KomodoMixinPlugin gate — Komodo is optional and targeted by string name
    // (no compile-time Komodo dependency needed at all, unlike Xaero).
    config "tacz_sewv.komodo.mixins.json"
    // Separate config + PlayerReviveMixinPlugin gate — PlayerReviveMod is optional (off the run
    // classpath unless -PwithPlayerRevive) and compileOnly like Xaero, so the mixin targets its
    // class directly.
    config "tacz_sewv.playerrevive.mixins.json"
}

repositories {
    maven {
        url "https://chocolateminecraft.com/maven"
        name "Xaero's Maven"
    }
    flatDir {
        dirs 'libs'
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        url = "https://maven.theillusivec4.top/"
        url = 'https://maven.parchmentmc.org'
        url = "https://repo.sleeping.town/"
    }
    maven {
        url = "https://jitpack.io"
        content {
            includeGroup "com.github.mcmodderanchor"
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("blank:superbwarfare:1.0")
    implementation fg.deobf("blank:curios:1.0")
    implementation fg.deobf("blank:geckolib:1.0")
    implementation fg.deobf("blank:kotlin:1.0")
    implementation fg.deobf("blank:simpleenemymod:1.0")
    implementation fg.deobf("blank:tacz:1.0")
    compileOnly fg.deobf("blank:berezka_api:1.0")
    // Soft: compile against OpenPAC API, keep off the published jar (same pattern as berezka_api).
    // runtimeOnly puts it on every run classpath for local testing with OpenPAC present.
    // Absent-path verification: ./gradlew runServerDev -PnoOpenPac  (skips runtimeOnly;
    // rename/remove libs/openpac.jar is the nuclear alternative if the property is ignored).
    compileOnly fg.deobf("blank:openpac:1.0")
    if (!project.hasProperty('noOpenPac')) {
        runtimeOnly fg.deobf("blank:openpac:1.0")
    }
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // Compile-only: SBW jarjars this; needed so MixinGeoArmorRenderer can target GeoArmorRenderer.
    compileOnly fg.deobf("com.github.mcmodderanchor:simplebedrockmodel:2.3.3-forge-mc1.20.1")
    // Soft: compile against Xaero's World Map; keep it off installs that omit it.
    // Absent-path verification: ./gradlew runClient -PnoXaero  (skips runtimeOnly;
    // XaeroMixinPlugin then refuses MixinGuiMap* so no "target was not found" warning).
    compileOnly "xaero.map:xaeroworldmap-forge-1.20.1:1.44.2:dev"
    if (!project.hasProperty('noXaero')) {
        runtimeOnly "xaero.map:xaeroworldmap-forge-1.20.1:1.44.2:dev"
    }
    // Soft: compile against Komodo (client-only SBW vehicle renderer); keep it off installs that
    // omit it. libs/komodo.jar is the official Forge 1.20.1 release jar (github.com/
    // Warfactory-Official/Komodo), same flatDir pattern as the other libs/*.jar deps.
    // Absent-path verification: ./gradlew runClient -PnoKomodo  (skips runtimeOnly;
    // KomodoMixinPlugin then refuses MixinKmodoDormancy so no "target was not found" warning).
    compileOnly fg.deobf("blank:komodo:1.0")
    if (!project.hasProperty('noKomodo')) {
        runtimeOnly fg.deobf("blank:komodo:1.0")
    }
    // Soft: compile against PlayerReviveMod (team.creative.playerrevive). libs/playerrevive.jar is
    // CreativeMD's own Forge 1.20.1 release jar, same flatDir pattern as the other libs/*.jar deps.
    // No mixin needed — PlayerReviveServer.revive/isBleeding are plain static methods taking only
    // vanilla Player, called directly from PlayerReviveCompat.
    // Same "off by default, opt in for local testing" shape as Extermination/Configured below: the
    // jar is off the run classpath unless requested, so PlayerReviveCompat.isLoaded() is false and
    // PlayerReviveGoal is never added by default. PlayerReviveMod itself hard-requires CreativeCore
    // (libs/creativecore.jar) to load at all, so that comes along under the same flag rather than
    // being a second toggle nobody would remember to pair up.
    //   ./gradlew runClient -PwithPlayerRevive
    compileOnly fg.deobf("blank:playerrevive:1.0")
    if (project.hasProperty('withPlayerRevive')) {
        runtimeOnly fg.deobf("blank:playerrevive:1.0")
        runtimeOnly fg.deobf("blank:creativecore:1.0")
    }
    // Soft: compile against Enhanced Falling Trees (MC 1.20/Forge 46, github.com/addavriance/
    // EnhancedFallingTrees). libs/efallingtrees.jar is its Forge release jar, same flatDir
    // pattern as the other libs/*.jar deps. Every EFT class this mod references (TreeRegistry/
    // TreeType/TreeEntity) is Architectury-free, so this compileOnly alone is enough to build —
    // see EnhancedFallingTreesCompat's class javadoc.
    compileOnly fg.deobf("blank:efallingtrees:1.0")
    // Same "off by default, opt in for local testing" shape as Extermination/Configured below:
    // EFT itself mandates Architectury API + Cloth Config (its own mods.toml), so both are pulled
    // in here too, under the same flag, rather than being separate toggles nobody would remember
    // to pair up correctly. Fetched from Modrinth (the real published, player-facing jars).
    //   ./gradlew runClient -PwithEnhancedFallingTrees
    //
    // KNOWN LIMITATION, not fixable from this build script: every Forge build of
    // architectury-api for 1.20.1 (tried 9.0.8 through 9.2.14, both Modrinth's copy and
    // dev.architectury's own maven — same bytecode either way) fails to load under
    // ForgeGradle's userdev launch specifically: its own bundled architectury.mixins.json
    // ("MixinFallingBlockEntity") shadows a vanilla field by raw SRG name with no refmap entry
    // for it, which only resolves inside Architectury Loom's own remap pipeline, not
    // ForgeGradle's. Confirmed as a general upstream issue, not specific to this project or to
    // EFT: an unrelated project hit the identical crash doing the same "architectury-api as a
    // plain dependency in a non-Loom ForgeGradle project" thing
    // (github.com/coding-1ab/mega-modpack/issues/4). A real, packaged Forge 1.20.1-47.2.0
    // install (drop these jars in mods/, no ForgeGradle involved) does not go through this dev
    // launch path and is the way to actually live-test this compat today; runClient/
    // runGameTestServer with this flag will crash at world bootstrap until upstream fixes it.
    if (project.hasProperty('withEnhancedFallingTrees')) {
        runtimeOnly fg.deobf("blank:efallingtrees:1.0")
        runtimeOnly "maven.modrinth:architectury-api:9.2.14+forge"
        runtimeOnly "maven.modrinth:cloth-config:11.1.136+forge"
    }
    // Soft: Extermination Tripod shield compat. No compileOnly — we never reference
    // Extermination types (registry-id only). Softcompat code stays; the jar is off the
    // run classpath by default ("good enough" for now). Opt back in with:
    //   ./gradlew runClient -PwithExtermination
    if (project.hasProperty('withExtermination')) {
        runtimeOnly fg.deobf("blank:extermination:1.0")
    }
    // Soft: Configured (in-game ForgeConfigSpec GUI). No compileOnly / no Java references —
    // declaration-only; Configured reads ConfigTracker for SERVER SewvConfig. Jar off the run
    // classpath by default; opt in with:
    //   ./gradlew runClient -PwithConfigured
    if (project.hasProperty('withConfigured')) {
        runtimeOnly fg.deobf("blank:configured:1.0")
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing:
// tasks.named('publish').configure {
//     dependsOn 'reobfJar'
// }

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// Imports only — no brace/indent rewrite. Groups: static | java/javax | third-party | project.
spotless {
    java {
        target 'src/*/java/**/*.java'
        removeUnusedImports()
        importOrder('java', 'javax', '', 'com.neoalive.tacz_sewv')
        trimTrailingWhitespace()
        endWithNewline()
    }
}
