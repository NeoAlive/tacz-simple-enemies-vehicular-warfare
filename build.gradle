}

// Average-modpack jars live in modpack/ (gitignored). syncModpack pulls from Prism.
def prismModsCandidates = [
        findProperty('profile_mods'),
        findProperty('modpack_source'),
        "${System.getProperty('user.home')}/AppData/Roaming/PrismLauncher/instances/1.21.1/minecraft/mods",
        "${System.getProperty('user.home')}/.local/share/PrismLauncher/instances/1.21.1/minecraft/mods",
].findAll { it != null && !it.toString().isEmpty() }.collect { file(it) }
def prismMods = prismModsCandidates.find { it.directory } ?: prismModsCandidates[0]

tasks.register('syncModpack', Sync) {
    group = 'neoforge port'
    description = "Copies enabled jars from ${prismMods} into modpack/ (skips *.disabled)."
    from(prismMods) {
        include '*.jar'
        exclude 'tacz_sewv*.jar'
    }
    into file('modpack')
}

// Opt-in push of the built jar into the Prism instance's mods folder.
// Usage: ./gradlew build -PsyncwithProfile   (NeoForge jars need no reobf.)
def syncWithProfile = project.hasProperty('syncwithProfile') || project.hasProperty('profilesync')
tasks.register('syncToProfile') {
    group = 'neoforge port'
    description = "Copies the built jar into ${prismMods} (opt-in via -PsyncwithProfile)."
    dependsOn 'jar'
    onlyIf { syncWithProfile }
    doLast {
        def built = tasks.named('jar', Jar).get().archiveFile.get().asFile
        if (!prismMods.directory) {
            throw new GradleException("Profile mods folder missing: ${prismMods}")
        }
        prismMods.eachFileMatch(~/tacz_sewv.*\.jar/) { it.delete() }
        copy { from built; into prismMods }
        println "Synced ${built.name} → ${prismMods}"
    }
}
if (syncWithProfile) {
    tasks.named('build').configure { finalizedBy 'syncToProfile' }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Imports only — no brace/indent rewrite. Groups: static | java/javax | third-party | project.
spotless {
    java {
        target 'src/*/java/**/*.java'
        removeUnusedImports()
        importOrder('java', 'javax', '', 'com.neoalive.tacz_sewv')
        trimTrailingWhitespace()
        endWithNewline()
    }
}
