org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Prism mods folder for this machine. syncModpack reads it; ./gradlew build -PsyncwithProfile
# writes the built jar there. A path that does not exist is skipped.
# build.gradle also probes ~/.local/share/PrismLauncher/... (Linux) and AppData (Windows).
# Override these two for your local Prism instance; leave them pointing at a missing path
# if you only use ./gradlew runClient / runServer without syncModpack.
profile_mods=/home/s4ndm4n/.local/share/PrismLauncher/instances/1.21.1/minecraft/mods
modpack_source=/home/s4ndm4n/.local/share/PrismLauncher/instances/1.21.1/minecraft/mods

# NeoForge 1.21.1 port branch (port/neoforge-1.21.1). main stays Forge 1.20.1.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
# 21.1.234 = SEM port's pin; SBW 0.8.9.1-1.21 builds against 21.1.228 and accepts [21.1.203,).
neo_version=21.1.234
neo_version_range=[21.1.203,)
loader_version_range=[1,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Superb Warfare — this branch requires the NeoForge 0.8.9.1-1.21 line (Mercurows/SuperbWarfare
# branch 0.8.9.1-1.21). syncPortDeps copies superbwarfare-0.8.9.1-*-mc1.21.1-*.jar from the parent
# folder (Modrinth release; 0.8.9.1-final is commit 5b92ebe1) into libs-neo/superbwarfare.jar, or else
# a local build of that checkout. SbwVersionMixinPlugin.SBW_RANGE must stay identical to sbw_version_range.
sbw_required_version=0.8.9.1
sbw_version_range=[0.8.9.1,)
sbw_port_dir=../Neoforge Port References/0.8.9.1-1.21

# Simple Enemy Mod — the NeoForge port (SimpleEnemyMod/Simple-Enemy-Mod-Public, branch sync/0.1.6),
# which keeps the sewv mixin surface stable (contract/sewv-surface.txt, checkSewvContract).
# libs-neo/simpleenemymod.jar is copied from its build/libs by syncPortDeps.
# SbwVersionMixinPlugin.SEM_RANGE must stay identical to sem_version_range.
sem_version_range=[1.21.1-0.1.6-hotfix.1,)
sem_port_version=1.21.1-0.1.6-hotfix.1
sem_port_dir=../SimpleEnemyMod/Simple-Enemy-Mod-Public

# Optional-mod release jars for the re-activated soft compats (Xaero's World Map, OpenPAC, PlayerRevive
# + CreativeCore, Enhanced Falling Trees). syncPortDeps copies them into libs-neo/compat/.
softcompat_neo_dir=../SOFTCOMPAT/NeoForge

mod_id=tacz_sewv
mod_name=SBW: Combined Arms
mod_license=GPL-3.0
mod_version=0.1.7
mod_group_id=com.neoalive.tacz_sewv
mod_authors=NeoAlive
mod_description=A Mil-Sim project based on Superb Warfare and TACZ: Simple Enemies Mod.