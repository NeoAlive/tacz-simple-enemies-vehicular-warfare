org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Source for ./gradlew syncModpack → modpack/ (average-modpack jars for runModded).
modpack_source=/home/wittgenstein/.local/share/PrismLauncher/instances/1.20.1(1)/minecraft/mods
# Destination for ./gradlew build -Pprofilesync (push built jar into the Prism test instance).
profile_mods=C:/Users/Hellv/AppData/Roaming/PrismLauncher/instances/1.20.1/minecraft/mods

minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
# 47.4.10 (was 47.2.0): the SEM 0.1.6-beta-hotfix jar has only a (FMLJavaModLoadingContext) mod
# constructor, which 47.2.0 cannot instantiate (NoSuchMethodException <init>()).
forge_version=47.4.10
forge_version_range=[47.2,)
loader_version_range=[47,)
mapping_channel=parchment
mapping_version=2023.08.13-1.20.1

# Superb Warfare — main requires 0.8.9.1+ (mods.toml ${sbw_version_range}).
# NOT back-compatible with 0.8.9; use git branch hotfix/0.8.9 for that line.
# build.gradle copies superbwarfare-${sbw_required_version}-*-all.jar from the
# parent Progetti/ folder into libs/superbwarfare.jar.
# SbwVersionMixinPlugin.SBW_RANGE must stay identical to sbw_version_range.
sbw_required_version=0.8.9.1
sbw_version_range=[0.8.9.1,)

# Simple Enemy Mod — requires the 0.1.6-beta-hotfix build or newer. NOT compatible with plain
# 1.20.1-0.1.6-beta: the hotfix moved the friendly-target veto into RU/US/PMC setTarget (early
# return) and added UnitFactionTags.isFriendlyToNpcFaction, which MixinPmcUnitEntity /
# MixinUnitFactionTags redirect and inject. Against 0.1.6-beta those targets do not exist.
# Maven ordering verified: beta < beta-hotfix. libs/simpleenemymod.jar must be this build
# (previous jar kept in libs/backup-sem-0.1.6-beta/).
# SbwVersionMixinPlugin.SEM_RANGE must stay identical to sem_version_range.
sem_version_range=[1.20.1-0.1.6-beta-hotfix,)

mod_id=tacz_sewv
mod_name=SBW: Combined Arms
mod_license=GPL-3.0
mod_version=0.1.6a
mod_group_id=com.neoalive.tacz_sewv
mod_authors=NeoAlive
mod_description=A Mil-Sim project based on Superb Warfare and TACZ: Simple Enemies Mod.