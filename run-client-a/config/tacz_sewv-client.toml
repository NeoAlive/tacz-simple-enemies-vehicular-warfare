
[interaction]
	#Show action-bar confirmations for successful orders.
	showOrderFeedback = true

[overlay]
	#Color Superb Warfare's hover overlay by the crew's faction.
	factionColorsEnabled = true
	#RU overlay/map color as RRGGBB.
	colorRu = "FF5555"
	#US overlay/map color as RRGGBB.
	colorUs = "5555FF"
	#PMC overlay/map color as RRGGBB.
	colorPmc = "55FF55"
	#Append AI helicopter firing-run phase (INGRESS/ATTACK/BREAK/…) to the hover name.
	heliShowRunPhase = true

[map]
	#Show SEWV unit/vehicle markers and map ordering UI on Xaero's World Map.
	#User-facing clutter toggle (not debug). Toggle in-game with the map markers keybind.
	mapMarkersEnabled = true
	#Keep singleplayer running while Xaero's map is open.
	mapLive = true
	#Draw unit-type icons on map markers.
	mapShowIcons = true
	#Draw health bars under owned PMC vehicle markers.
	mapShowHealthBar = true
	#Draw energy bars under owned PMC vehicle markers.
	mapShowEnergyBar = true
	#Debug: commander ★/·, BattleField overlay, play name, per-tank role tags (BoF/MNV/…).
	mapShowCommandDebug = false

