[interaction]
	#Show a short message above the hotbar when an order succeeds.
	showOrderFeedback = true
	#Quick Evac unit pick only: off (default) = all owned on-foot PMCs within
	#quickEvacBoardRadius of the player. On = ribbon/SEM selection only.
	#Does not affect Board / Follow / Formation / other pipelines.
	quickEvacPullSelectedFromRibbon = false

[overlay]
	#Tint Superb Warfare's vehicle hover text by who is crewing it (RU / US / PMC).
	factionColorsEnabled = true
	#RU colour as six hex digits (RRGGBB), e.g. FF5555.
	colorRu = "FF5555"
	#US colour as six hex digits (RRGGBB), e.g. 5555FF.
	colorUs = "5555FF"
	#PMC colour as six hex digits (RRGGBB), e.g. 55FF55.
	colorPmc = "55FF55"
	#On AI helicopters, append the current attack phase to the hover name
	#(approach, attack, break away, and so on).
	heliShowRunPhase = true
	#Show HUD notification banners (unit downed, vehicle destroyed, ammo out, and so on).
	notificationsEnabled = true
	#How many seconds each HUD notification ticket stays on screen before it slides away.
	# Default: 5
	# Range: 1 ~ 30
	notificationScreenSeconds = 5
	#How many HUD notification tickets may show stacked at once (extras wait in a backlog).
	# Default: 3
	# Range: 1 ~ 8
	notificationMaxVisible = 3
	#Desaturate only the PMC MICH DogTag UV to low-contrast grey (logo alpha kept).
	helmetGrayscale = true
	#On joining a world, print a chat tip on disabling SuperbWarfare's projectile chunk loading.
	showLagTip = true

[map]
	#Show unit and vehicle markers on Xaero's World Map, and allow ordering from the map.
	#You can also toggle this in-game with the map markers keybind.
	mapMarkersEnabled = true
	#In singleplayer, keep the world running while Xaero's map screen is open
	#(otherwise the game pauses and markers go stale).
	mapLive = true
	#Draw vehicle-type icons on map markers.
	mapShowIcons = true
	#Draw a health bar under your own PMC vehicle markers.
	mapShowHealthBar = true
	#Draw an energy/fuel bar under your own PMC vehicle markers.
	mapShowEnergyBar = true
	#Developer overlay: battle-group commander marks, play names, and per-tank role tags.
	#Leave off unless you are debugging AI command.
	mapShowCommandDebug = false

[debug]
	#Log ground vehicle pathing / shoreline probes.
	groundPathingDebug = false
	#Log ship pathing / depth probes.
	shipPathingDebug = false
	#General [sewv-diag] channels (targeting, scan, claim, …).
	sewvDiagDebug = false
	#Helicopter combat / run-phase diagnosis (logs + overlay).
	heliCombatDebug = false
	#Helicopter flight-stack telemetry: one [sewv heli] line per hull per second
	#(procedure, state, reference, errors, saturation). Server side; singleplayer reads this flag.
	heliFlightDebug = false
	#Fixed-wing combat / landing diagnosis (logs + client arcs).
	planeCombatDebug = false
	#Log mortar / Type-63 crew gates (why a tube is holding).
	mortarDebugLogging = false
	#Print TaCZ→SBW ballistic translation for every translated hit.
	ballisticTranslationDebug = false
	#Log refused orders (default on — silent until something fails).
	orderFailureDebug = true
	#Render spawn_probe blocks with the barrier placeholder texture.
	showSpawnProbes = false
	#Log cover-cache bake and per-crew posture.
	individualTacticsDebug = false
	#Log battle groups, plays, per-crew roles/destinations and idle formation clusters.
	collectiveAiDebug = false
	#Log each ground crew's utility decision (plan, scores, blocked actions, tasked role).
	individualAiDebug = false
	#FOB route, assign, resupply, and stale-state logging.
	fobDebug = false
