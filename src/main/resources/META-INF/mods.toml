modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" 
license="${mod_license}"
[[mods]] #mandatory
modId="tacz_sewv" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
authors="${mod_authors}" #optional
logoFile="pack.png" 

description='''${mod_description}'''

[[mixins]]
config="tacz_sewv.mixins.json"

# Xaero's World Map compat. Separate config ("required": false) + XaeroMixinPlugin (LoadingModList
# gate on mod id xaeroworldmap) so an absent World Map never queues MixinGuiMap*.
[[mixins]]
config="tacz_sewv.xaero.mixins.json"

# Komodo (client-only SBW vehicle renderer) compat. Separate config ("required": false) +
# KomodoMixinPlugin (LoadingModList gate on mod id komodo) so an absent Komodo never queues
# MixinKmodoDormancy. Compiled against libs/komodo.jar (compileOnly), same as Xaero above.
[[mixins]]
config="tacz_sewv.komodo.mixins.json"

# PlayerReviveMod compat. Separate config ("required": false) + PlayerReviveMixinPlugin
# (LoadingModList gate on mod id playerrevive) so an absent PlayerReviveMod never queues
# MixinReviveEventServer. Compiled against libs/playerrevive.jar (compileOnly), same as
# Xaero/Komodo above.
[[mixins]]
config="tacz_sewv.playerrevive.mixins.json"

# Corpse (henkelmax) compat. Separate config ("required": false) + CorpseMixinPlugin
# (LoadingModList gate on mod id corpse) so an absent Corpse never queues MixinCorpseEntity /
# skin render mixins. Compiled against libs/corpse.jar (compileOnly).
[[mixins]]
config="tacz_sewv.corpse.mixins.json"

# MineColonies compat. Separate config ("required": false) + MineColoniesMixinPlugin
# (LoadingModList gate on mod id minecolonies) so an absent MineColonies never queues
# MixinGuardTargeting / MixinRaidManager. Compiled against libs/minecolonies.jar (compileOnly),
# same as Xaero/Komodo/PlayerRevive above.
[[mixins]]
config="tacz_sewv.minecolonies.mixins.json"

[[dependencies.tacz_sewv]] #optional
    modId="forge" #mandatory
    mandatory=true #mandatory
    versionRange="${forge_version_range}" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.tacz_sewv]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# SBW ${sbw_version_range} only on main — not back-compatible with 0.8.9 (that line: branch hotfix/0.8.9).
# SbwVersionMixinPlugin skips all mixins when the installed SBW is outside this range so Forge can
# show the version requirement instead of a mixin inject crash.
[[dependencies.tacz_sewv]]
    modId="superbwarfare"
    mandatory=true
    versionRange="${sbw_version_range}"
    ordering="AFTER"
    side="BOTH"

# Hard incompatible: berezka_api (if present). Forge 1.20.1 has no type="incompatible"; same
# pattern SBW uses for geckoanimfix — mandatory=false + a range nothing satisfies. Absent = OK;
# present = loading error naming this dependency. See build.gradle incompatibleModJars.
# The range string is the message players see under "Expected range" on the Forge error screen.
[[dependencies.tacz_sewv]]
    modId="berezka_api"
    mandatory=false
    versionRange="[99999.0.Remove_berezka_api_incompatible_with_tacz_sewv,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.tacz_sewv]]
    modId="tacz"
    mandatory=true
    versionRange="[1.1.4,)"
    ordering="BEFORE"
    side="BOTH"

[[dependencies.tacz_sewv]]
    modId="simpleenemymod"
    mandatory=true
    versionRange="[1.20.1-0.1.6-beta,)"
    ordering="AFTER"
    side="BOTH"

# Soft compat: your own PMC vehicles show as markers on the world map and can be ordered from it.
[[dependencies.tacz_sewv]]
    modId="xaeroworldmap"
    mandatory=false
    versionRange="[1.44.0,)"
    ordering="AFTER"
    side="CLIENT"

# Soft compat: Komodo speeds up SBW vehicle rendering and lets AI-crewed hulls that are actually
# idle enter its dormancy fast path (MixinKmodoDormancy). Client-only, absent by default.
[[dependencies.tacz_sewv]]
    modId="komodo"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="CLIENT"

# Soft compat: Open Parties and Claims (chunk claims / parties). Optional — absent on installs
# without it; present on local runs via runtimeOnly blank:openpac.
[[dependencies.tacz_sewv]]
    modId="openpartiesandclaims"
    mandatory=false
    versionRange="[0.29.0,)"
    ordering="AFTER"
    side="BOTH"

# Softcompat vehicle addons — optional; pools and softcompat helpers activate when present.
[[dependencies.tacz_sewv]]
    modId="fcp"
    mandatory=false
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.tacz_sewv]]
    modId="mcsp"
    mandatory=false
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.tacz_sewv]]
    modId="ashvehicle"
    mandatory=false
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.tacz_sewv]]
    modId="vvp"
    mandatory=false
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"

# Soft compat: Tripod shield (ranged block + HP + cosmetic flare). Optional — absent installs skip all ExterminationCompat paths.
[[dependencies.tacz_sewv]]
    modId="extermination"
    mandatory=false
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"

# Soft compat: Enhanced Falling Trees. Ground vehicles fell whole trees they drive into instead
# of routing around every trunk. Optional — absent installs skip all EnhancedFallingTreesCompat
# paths and trees stay ordinary hard obstacles.
[[dependencies.tacz_sewv]]
    modId="efallingtrees"
    mandatory=false
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"

# Soft compat: PlayerReviveMod. Optional — a friendly PMC auto-revives a downed player, and this
# mod's own PMC-downed system (see PmcDownedSupport) bundles under the same presence gate. Absent
# installs skip PlayerReviveGoal/DownedGoal/PmcReviveGoal entirely; PMCs just die like RU/US.
[[dependencies.tacz_sewv]]
    modId="playerrevive"
    mandatory=false
    versionRange="[2.0.31,)"
    ordering="AFTER"
    side="BOTH"

# Soft compat: Corpse (henkelmax). Optional — RU/US/PMC unit deaths spawn lootable corpses when
# present (see CorpseCompat). Absent installs keep SEM ground drops unchanged.
[[dependencies.tacz_sewv]]
    modId="corpse"
    mandatory=false
    versionRange="[1.0,)"
    ordering="NONE"
    side="BOTH"

# Soft compat: Configured (in-game ForgeConfigSpec GUI). Optional — no SEWV Java references;
# Configured discovers SewvConfig via ConfigTracker (SERVER included). Absent installs are identical.
[[dependencies.tacz_sewv]]
    modId="configured"
    mandatory=false
    versionRange="[2.2.3,)"
    ordering="NONE"
    side="CLIENT"
