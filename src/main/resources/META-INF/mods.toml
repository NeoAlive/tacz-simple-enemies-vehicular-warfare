modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" 
license="${mod_license}"
[[mods]] #mandatory
modId="tacz_sewv" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
authors="${mod_authors}" #optional
logoFile="pack.png" 

description='''${mod_description}'''

[[mixins]]
config="tacz_sewv.mixins.json"

# Xaero's World Map compat. Separate config ("required": false) + XaeroMixinPlugin (LoadingModList
# gate on mod id xaeroworldmap) so an absent World Map never queues MixinGuiMap*.
[[mixins]]
config="tacz_sewv.xaero.mixins.json"

# Komodo (client-only SBW vehicle renderer) compat. Separate config ("required": false) +
# KomodoMixinPlugin (LoadingModList gate on mod id komodo) so an absent Komodo never queues
# MixinKmodoDormancy. Compiled against libs/komodo.jar (compileOnly), same as Xaero above.
[[mixins]]
config="tacz_sewv.komodo.mixins.json"

[[dependencies.tacz_sewv]] #optional
    modId="forge" #mandatory
    mandatory=true #mandatory
    versionRange="${forge_version_range}" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.tacz_sewv]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.tacz_sewv]]
    modId="superbwarfare"
    mandatory=true
    versionRange="[0.8.9,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.tacz_sewv]]
    modId="tacz"
    mandatory=true
    versionRange="[1.1.4,)"
    ordering="BEFORE"
    side="BOTH"

[[dependencies.tacz_sewv]]
    modId="simpleenemymod"
    mandatory=true
    versionRange="[1.20.1-0.1.6-beta,)"
    ordering="AFTER"
    side="BOTH"

# Soft compat: structures spawn faction vehicles when present. Optional — load AFTER it
# so its onStructureSpawned event class exists when we register a listener for it.
[[dependencies.tacz_sewv]]
    modId="berezka_api"
    mandatory=false
    versionRange="[1.2.9,)"
    ordering="AFTER"
    side="BOTH"

# Soft compat: your own PMC vehicles show as markers on the world map and can be ordered from it.
[[dependencies.tacz_sewv]]
    modId="xaeroworldmap"
    mandatory=false
    versionRange="[1.44.0,)"
    ordering="AFTER"
    side="CLIENT"

# Soft compat: Komodo speeds up SBW vehicle rendering and lets AI-crewed hulls that are actually
# idle enter its dormancy fast path (MixinKmodoDormancy). Client-only, absent by default.
[[dependencies.tacz_sewv]]
    modId="komodo"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="CLIENT"

# Soft compat: Open Parties and Claims (chunk claims / parties). Optional — absent on installs
# without it; present on local runs via runtimeOnly blank:openpac.
[[dependencies.tacz_sewv]]
    modId="openpartiesandclaims"
    mandatory=false
    versionRange="[0.29.0,)"
    ordering="AFTER"
    side="BOTH"

# Softcompat vehicle addons — optional; pools and softcompat helpers activate when present.
[[dependencies.tacz_sewv]]
    modId="fcp"
    mandatory=false
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.tacz_sewv]]
    modId="mcsp"
    mandatory=false
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.tacz_sewv]]
    modId="ashvehicle"
    mandatory=false
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.tacz_sewv]]
    modId="vvp"
    mandatory=false
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"

# Soft compat: Tripod shield (ranged block + HP + cosmetic flare). Optional — absent installs skip all ExterminationCompat paths.
[[dependencies.tacz_sewv]]
    modId="extermination"
    mandatory=false
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"

# Soft compat: Enhanced Falling Trees. Ground vehicles fell whole trees they drive into instead
# of routing around every trunk. Optional — absent installs skip all EnhancedFallingTreesCompat
# paths and trees stay ordinary hard obstacles.
[[dependencies.tacz_sewv]]
    modId="efallingtrees"
    mandatory=false
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"

# Soft compat: Configured (in-game ForgeConfigSpec GUI). Optional — no SEWV Java references;
# Configured discovers SewvConfig via ConfigTracker (SERVER included). Absent installs are identical.
[[dependencies.tacz_sewv]]
    modId="configured"
    mandatory=false
    versionRange="[2.2.3,)"
    ordering="NONE"
    side="CLIENT"
