modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}"
license="${mod_license}"
[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
authors="${mod_authors}" #optional
logoFile="pack.png"

description='''${mod_description}'''

[[mixins]]
config="tacz_sewv.mixins.json"

# Unit loadout manager: hooks SEM's UnitLoadoutManager.apply (raw JSON, upstream of SEM Extended and the
# Berezka config mod). Separate config ("required": false, defaultRequire 0) — see loadout/LoadoutManager.
[[mixins]]
config="tacz_sewv.loadouts.mixins.json"

# Xaero's World Map compat. Separate config ("required": false) + XaeroMixinPlugin (LoadingModList
# gate on mod id xaeroworldmap) so an absent World Map never queues MixinGuiMap*.
[[mixins]]
config="tacz_sewv.xaero.mixins.json"

# PlayerReviveMod compat. Separate config ("required": false) + PlayerReviveMixinPlugin
# (LoadingModList gate on mod id playerrevive) so an absent PlayerReviveMod never queues
# MixinReviveEventServer.
[[mixins]]
config="tacz_sewv.playerrevive.mixins.json"

# NeoForge port branch: Komodo, Corpse and MineColonies (mixin configs + soft dependencies), plus
# Limitless Vehicles and Berezka, are dormant here — see dormantSources in build.gradle.

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# SBW ${sbw_version_range}, NeoForge 1.21.1 line (0.8.9.1-1.21).
# SbwVersionMixinPlugin skips all mixins when the installed SBW is outside this range so the loader
# can show the version requirement instead of a mixin inject crash.
[[dependencies.${mod_id}]]
    modId="superbwarfare"
    type="required"
    versionRange="${sbw_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="tacz"
    type="required"
    versionRange="[1.1.4,)"
    ordering="BEFORE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="simpleenemymod"
    type="required"
    versionRange="${sem_version_range}"
    ordering="AFTER"
    side="BOTH"

# Soft compat: Enhanced Falling Trees. Ground vehicles fell whole trees they drive into instead
# of routing around every trunk. Optional — absent installs skip all EnhancedFallingTreesCompat
# paths and trees stay ordinary hard obstacles.
[[dependencies.${mod_id}]]
    modId="efallingtrees"
    type="optional"
    versionRange="[0.7.0,)"
    ordering="NONE"
    side="BOTH"

# Soft compat: PlayerReviveMod. Optional — a friendly PMC auto-revives a downed player, and this
# mod's own PMC-downed system (see PmcDownedSupport) bundles under the same presence gate. Absent
# installs skip PlayerReviveGoal/DownedGoal/PmcReviveGoal entirely; PMCs just die like RU/US.
[[dependencies.${mod_id}]]
    modId="playerrevive"
    type="optional"
    versionRange="[2.1.2,)"
    ordering="AFTER"
    side="BOTH"

# Soft compat: Open Parties and Claims (chunk claims / parties). Optional — absent on installs
# without it; present on local runs unless -PnoOpenPac.
[[dependencies.${mod_id}]]
    modId="openpartiesandclaims"
    type="optional"
    versionRange="[0.33.0,)"
    ordering="AFTER"
    side="BOTH"

# Soft compat: your own PMC vehicles show as markers on the world map and can be ordered from it.
[[dependencies.${mod_id}]]
    modId="xaeroworldmap"
    type="optional"
    versionRange="[1.47.0,)"
    ordering="AFTER"
    side="CLIENT"
